<div class="stack">
  <div class="page-head">
    <h1>Categories</h1>
    <div class="head-actions">
      <button type="button" class="btn btn-primary" (click)="openAdd()">
        <sf-icon name="plus" [size]="16" /> Add
      </button>
    </div>
  </div>

  <div class="segmented">
    @for (t of tabs; track t) {
      <button type="button" [class.active]="tab() === t" (click)="tab.set(t)">
        {{ typeLabel(t) }} <span class="count">{{ tabCounts()[t] }}</span>
      </button>
    }
  </div>

  @if (categories().length === 0) {
    <div class="empty-state card">
      <sf-icon name="tag" [size]="28" />
      <p>No {{ typeLabel(tab()) }} categories yet.</p>
    </div>
  } @else {
    <div class="stack">
      @for (c of categories(); track c.id) {
        <div class="card row" (click)="openEdit(c)">
          <div class="dot" [style.background]="c.color"></div>
          <div class="name">{{ c.name }}</div>
          @if (c.locked) {
            <span class="badge-locked" title="Used by Fixed Deposits and Investments - can't be deleted">Locked</span>
          } @else {
            <button type="button" class="icon-btn" (click)="$event.stopPropagation(); remove(c.id)" aria-label="Delete">
              <sf-icon name="trash" [size]="16" />
            </button>
          }
        </div>
      }
    </div>
  }
</div>

@if (showModal()) {
  <sf-modal [title]="editingId() ? 'Edit Category' : 'Add Category'" (close)="showModal.set(false)">
    <div class="field-row">
      <label>
        Name
        <input type="text" [ngModel]="name()" (ngModelChange)="name.set($event)" (keydown.enter)="save()" />
      </label>
      <label>
        Type
        <select [ngModel]="type()" (ngModelChange)="type.set($event)">
          <option value="income">Income</option>
          <option value="expense">Expense</option>
          <option value="commitment">Commitment</option>
          <option value="others-in">Others (In)</option>
          <option value="others-out">Others (Out)</option>
        </select>
      </label>
      <label>
        Color
        <sf-color-picker [(value)]="color" />
      </label>
    </div>
    <button type="button" class="btn btn-primary btn-block" (click)="save()">Save</button>
  </sf-modal>
}
